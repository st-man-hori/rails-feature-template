name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check code style (RuboCop)
        run: bundle exec rubocop

      - name: Static analysis (Brakeman)
        run: bundle exec brakeman -q

      - name: Run tests
        run: bundle exec rspec
